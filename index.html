<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Video Organizer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b0000">
<style>
  :root { --bg: #1a0f0f; --card: #2a1a1a; --accent: #8b0000; --text: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 18px; }
  header { padding: 16px; background: #120808; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { background: var(--accent); color: white; border: none; padding: 14px 22px; border-radius: 10px; font-size: 18px; cursor: pointer; }
  #main { flex: 1; display: flex; overflow: hidden; }
  #folders { width: 26%; background: #120808; overflow-y: auto; padding: 12px; }
  #folders .folder { padding: 14px 12px; margin: 6px 0; background: var(--card); border-radius: 10px; cursor: pointer; font-size: 18px; }
  #folders .folder.active { background: var(--accent); }
  #center { flex: 1; display: flex; flex-direction: column; }
  #player { height: 42%; background: #000; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  #videos { height: 36%; background: #0d0808; overflow-x: auto; display: flex; gap: 12px; padding: 12px; }
  .video-card { min-width: 180px; background: var(--card); border-radius: 12px; padding: 8px; }
  .video-card.selected { border: 3px solid #ff4444; }
  .video-card video { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; }
  .video-card div { font-size: 14px; margin-top: 6px; }
  #status { font-size: 16px; }
</style>
</head>
<body>
<header>
  <button id="btnOpen">📂 Ordner öffnen</button>
  <button id="btnUpdate">🔄 Aktualisieren</button>
  <button id="btnMove">📁 Verschieben</button>
  <span id="status">Kein Ordner gewählt</span>
</header>
<div id="main">
  <div id="folders"></div>
  <div id="center">
    <div id="player"><span>Video-Vorschau</span></div>
  </div>
</div>
<div id="videos"></div>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
const categories = [
  { name: "Neu/Import", subs: [] },
  { name: "Vorspiel", subs: ["Küssen", "Ausziehen", "Streicheln"] },
  { name: "Blowjob", subs: ["Blasen", "Deepthroat", "Maulfick"] },
  { name: "Ficken", subs: ["Missionar", "Doggy", "Reiterin"] },
  { name: "Anal", subs: ["Arsch lecken", "Anal"] },
  { name: "Abspritzen", subs: ["Ins Maul spritzen", "Ins Gesicht spritzen"] },
  { name: "Sperma-Spiele", subs: ["Sperma schlucken", "Sperma gurgeln"] },
  { name: "Fesseln & Spiele", subs: ["Fesseln", "Spanking"] }
];
let videos = [], selected = new Set(), currentFolder = null;
function renderFolders() {
  const el = document.getElementById("folders");
  el.innerHTML = "";
  categories.forEach(cat => {
    const d = document.createElement("div");
    d.className = "folder" + (currentFolder === cat.name ? " active" : "");
    d.textContent = cat.name;
    d.onclick = () => { currentFolder = cat.name; renderFolders(); renderVideos(); };
    el.appendChild(d);
    cat.subs.forEach(sub => {
      const s = document.createElement("div");
      s.className = "folder";
      s.style.marginLeft = "20px";
      s.style.fontSize = "16px";
      s.textContent = "› " + sub;
      s.onclick = () => { currentFolder = cat.name + "/" + sub; renderFolders(); renderVideos(); };
      el.appendChild(s);
    });
  });
}
function renderVideos() {
  const el = document.getElementById("videos");
  el.innerHTML = "";
  const list = currentFolder ? videos.filter(v => v.folder === currentFolder || !v.folder) : videos;
  list.forEach(v => {
    const card = document.createElement("div");
    card.className = "video-card" + (selected.has(v.id) ? " selected" : "");
    const vid = document.createElement("video");
    vid.src = v.url; vid.muted = true; vid.preload = "metadata";
    card.appendChild(vid);
    const n = document.createElement("div"); n.textContent = v.name; card.appendChild(n);
    card.onclick = () => {
      selected.has(v.id) ? selected.delete(v.id) : selected.add(v.id);
      renderVideos();
      document.getElementById("player").innerHTML = "<video src='" + v.url + "' controls style='max-width:100%;max-height:100%'></video>";
    };
    el.appendChild(card);
  });
  document.getElementById("status").textContent = list.length + " Videos" + (selected.size ? " · " + selected.size + " ausgewählt" : "");
}
document.getElementById("btnOpen").onclick = async () => {
  try {
    const dir = await window.showDirectoryPicker();
    videos = [];
    for await (const e of dir.values()) {
      if (e.kind === "file" && e.name.match(/\.(mp4|webm|mov|mkv)$/i)) {
        const f = await e.getFile();
        videos.push({ id: e.name + Math.random(), name: e.name, url: URL.createObjectURL(f), folder: null });
      }
    }
    currentFolder = null;
    renderFolders(); renderVideos();
  } catch(e) { document.getElementById("status").textContent = "Zugriff abgebrochen"; }
};
document.getElementById("btnUpdate").onclick = () => { renderVideos(); document.getElementById("status").textContent = "Aktualisiert"; };
document.getElementById("btnMove").onclick = () => {
  if (!selected.size) { alert("Zuerst Videos auswählen"); return; }
  const t = prompt("Zielordner (z.B. Blowjob/Blasen):", currentFolder || "Blowjob/Blasen");
  if (t) {
    videos.forEach(v => { if (selected.has(v.id)) v.folder = t; });
    selected.clear();
    renderVideos();
  }
};
renderFolders();
</script>
</body>
</html>
