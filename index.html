<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Video Organizer</title>
<meta name="theme-color" content="#8b0000">
<style>
  :root { --bg: #1a0f0f; --card: #2a1a1a; --accent: #8b0000; --text: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 17px; }
  header { padding: 12px; background: #120808; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: var(--accent); color: white; border: none; padding: 12px 18px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  #main { flex: 1; display: flex; overflow: hidden; }
  #folders { width: 24%; background: #120808; overflow-y: auto; padding: 10px; }
  #folders .folder { padding: 12px; margin: 5px 0; background: var(--card); border-radius: 10px; cursor: pointer; }
  #folders .folder.active { background: var(--accent); }
  #center { flex: 1; display: flex; flex-direction: column; padding: 8px; }
  #player { height: 38%; background: #000; display: flex; align-items: center; justify-content: center; }
  #trim { background: #120808; padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #actions { background: #120808; padding: 8px; max-height: 120px; overflow-y: auto; }
  .action-chip { display: inline-block; background: #3a2020; padding: 6px 12px; margin: 4px; border-radius: 20px; cursor: pointer; }
  .action-chip.marked { background: #8b0000; }
  #sequence { margin: 8px 0; min-height: 40px; }
  #videos { height: 28%; background: #0d0808; overflow-x: auto; display: flex; gap: 10px; padding: 10px; }
  .video-card { min-width: 160px; background: var(--card); border-radius: 10px; padding: 6px; }
  .video-card.selected { border: 3px solid #ff4444; }
  .video-card video { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <button id="btnOpen">📂 Ordner öffnen</button>
  <button id="btnUpdate">🔄 Aktualisieren</button>
  <button id="btnMove">📁 Verschieben</button>
  <button id="btnSave">💾 Speichern</button>
  <span id="status">Kein Ordner gewählt</span>
</header>
<div id="main">
  <div id="folders"></div>
  <div id="center">
    <div id="player"><span>Video-Vorschau</span></div>
    <div id="trim">
      <span>✂ Schnitt:</span>
      <button id="btnStart">⟦ Anfang</button>
      <button id="btnEnd">Ende ⟧</button>
      <button id="btnReset">↺ Ganz</button>
      <span id="trimInfo">0:00 – 0:00</span>
    </div>
    <div id="actions">
      <div><b>Handlungen der Reihe nach:</b> <span id="sequence"></span></div>
      <div id="actionButtons"></div>
    </div>
  </div>
</div>
<div id="videos"></div>
<script>
const categories = [
  { name: "Neu/Import", subs: [] },
  { name: "Vorspiel", subs: ["Küssen", "Ausziehen", "Streicheln", "Titten kneten", "Fingern", "Lecken", "Rimming"] },
  { name: "Blowjob", subs: ["Blasen", "Eier lecken", "Deepthroat", "Maulfick", "Sabbern", "Kehle halten"] },
  { name: "Ficken", subs: ["Missionar", "Reiterin", "Doggy", "Löffelchen", "Im Stehen", "Hart rannehmen"] },
  { name: "Anal", subs: ["Arsch lecken", "Anal eindringen", "Anal hart", "Arsch → Maul"] },
  { name: "Fesseln & Spiele", subs: ["Fesseln", "Augen verbinden", "Haare ziehen", "Spanking", "Knien lassen", "Spielzeug"] },
  { name: "Abspritzen", subs: ["Ins Maul spritzen", "Ins Gesicht spritzen", "Auf die Titten spritzen", "Auf den Arsch spritzen", "In die Fotze spritzen", "In den Arsch spritzen"] },
  { name: "Sperma", subs: ["Sperma im Mund lassen", "Sperma zeigen", "Sperma gurgeln", "Sperma im Gesicht verreiben", "Sperma ausspucken", "Sperma schlucken", "Sauberlecken"] }
];
let videos = [], selected = new Set(), currentFolder = null;
let currentVideo = null;
let sequence = [];
let trimStart = 0, trimEnd = 0;

function renderFolders() {
  const el = document.getElementById("folders");
  el.innerHTML = "";
  categories.forEach(cat => {
    const d = document.createElement("div");
    d.className = "folder" + (currentFolder === cat.name ? " active" : "");
    d.textContent = cat.name;
    d.onclick = () => { currentFolder = cat.name; renderFolders(); renderVideos(); };
    el.appendChild(d);
    cat.subs.forEach(sub => {
      const s = document.createElement("div");
      s.className = "folder";
      s.style.marginLeft = "16px";
      s.style.fontSize = "15px";
      s.textContent = "› " + sub;
      s.onclick = () => { currentFolder = cat.name + "/" + sub; renderFolders(); renderVideos(); };
      el.appendChild(s);
    });
  });
}

function renderActionButtons() {
  const el = document.getElementById("actionButtons");
  el.innerHTML = "";
  categories.forEach(cat => {
    if (cat.subs.length === 0) return;
    const group = document.createElement("div");
    group.innerHTML = "<b>" + cat.name + ":</b> ";
    cat.subs.forEach(sub => {
      const chip = document.createElement("span");
      chip.className = "action-chip" + (sequence.includes(sub) ? " marked" : "");
      chip.textContent = sub;
      chip.onclick = () => {
        if (sequence.includes(sub)) {
          sequence = sequence.filter(x => x !== sub);
        } else {
          sequence.push(sub);
        }
        renderSequence();
        renderActionButtons();
      };
      group.appendChild(chip);
    });
    el.appendChild(group);
  });
}

function renderSequence() {
  document.getElementById("sequence").innerHTML = sequence.map((s, i) => (i+1) + ". " + s).join(" → ") || "(noch keine)";
}

function renderVideos() {
  const el = document.getElementById("videos");
  el.innerHTML = "";
  const list = currentFolder ? videos.filter(v => v.folder === currentFolder || !v.folder) : videos;
  list.forEach(v => {
    const card = document.createElement("div");
    card.className = "video-card" + (selected.has(v.id) ? " selected" : "");
    const vid = document.createElement("video");
    vid.src = v.url; vid.muted = true; vid.preload = "metadata";
    card.appendChild(vid);
    const n = document.createElement("div"); n.textContent = v.name; n.style.fontSize = "13px"; card.appendChild(n);
    card.onclick = () => {
      selected.has(v.id) ? selected.delete(v.id) : selected.add(v.id);
      currentVideo = v;
      playVideo(v);
      renderVideos();
    };
    el.appendChild(card);
  });
  document.getElementById("status").textContent = list.length + " Videos" + (selected.size ? " · " + selected.size + " ausgewählt" : "");
}

function playVideo(v) {
  const p = document.getElementById("player");
  p.innerHTML = "";
  const vid = document.createElement("video");
  vid.src = v.url;
  vid.controls = true;
  vid.style.maxWidth = "100%";
  vid.style.maxHeight = "100%";
  vid.id = "mainVideo";
  p.appendChild(vid);
  sequence = v.sequence || [];
  renderSequence();
  renderActionButtons();
}

document.getElementById("btnOpen").onclick = async () => {
  try {
    const dir = await window.showDirectoryPicker();
    videos = [];
    for await (const e of dir.values()) {
      if (e.kind === "file" && e.name.match(/\.(mp4|webm|mov|mkv)$/i)) {
        const f = await e.getFile();
        videos.push({ id: e.name + Math.random(), name: e.name, url: URL.createObjectURL(f), folder: null, sequence: [] });
      }
    }
    currentFolder = null;
    renderFolders();
    renderVideos();
    renderActionButtons();
  } catch(e) {}
};

document.getElementById("btnUpdate").onclick = () => { renderVideos(); document.getElementById("status").textContent = "Aktualisiert"; };
document.getElementById("btnMove").onclick = () => {
  if (!selected.size) { alert("Zuerst Videos auswählen"); return; }
  const t = prompt("Zielordner:", currentFolder || "Blowjob/Blasen");
  if (t) {
    videos.forEach(v => { if (selected.has(v.id)) v.folder = t; });
    selected.clear();
    renderVideos();
  }
};
document.getElementById("btnSave").onclick = () => {
  if (currentVideo) {
    currentVideo.sequence = [...sequence];
    alert("Gespeichert: " + sequence.join(" → "));
  }
};
document.getElementById("btnStart").onclick = () => {
  const v = document.getElementById("mainVideo");
  if (v) { trimStart = v.currentTime; updateTrim(); }
};
document.getElementById("btnEnd").onclick = () => {
  const v = document.getElementById("mainVideo");
  if (v) { trimEnd = v.currentTime; updateTrim(); }
};
document.getElementById("btnReset").onclick = () => { trimStart = 0; trimEnd = 0; updateTrim(); };
function updateTrim() {
  document.getElementById("trimInfo").textContent = Math.floor(trimStart) + "s – " + Math.floor(trimEnd) + "s";
}

renderFolders();
renderActionButtons();
</script>
</body>
</html>
